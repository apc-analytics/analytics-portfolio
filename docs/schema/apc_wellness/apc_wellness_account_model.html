<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APC Wellness — Account Model</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fff;
    color: #1a1a1a;
    max-width: 800px;
    margin: 48px auto;
    padding: 0 24px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.meta { color: #666; font-size: 0.9rem; margin-top: 0; margin-bottom: 32px; }
  code { background: #f2f2f2; padding: 2px 6px; border-radius: 3px; font-size: 0.85em; }
  a.back { display: inline-block; margin-top: 32px; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #0F1214; color: #EDEAE2; }
    code { background: #171B1E; }
    p.meta { color: #8B9198; }
  }
  #erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
  #erd svg.erDiagram .row-rect-odd path,
  #erd svg.erDiagram .row-rect-odd rect,
  #erd svg.erDiagram .row-rect-even path,
  #erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
</head>
<body>
<h1>APC Wellness — account model</h1>
<p class="meta">Core accounts / members / subscriptions / plans structure, part of the <code>db_portfolio</code> warehouse (<code>*_apc_wellness</code> schemas).</p>
<div id="erd"></div>
<a class="back" href="../../apc_wellness/index.html">&larr; Back to portfolio</a>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Segoe UI", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Segoe UI", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  ACCOUNTS ||--o{ MEMBERS : has
  MEMBERS ||--o{ SUBSCRIPTIONS : enrolls_in
  PLANS ||--o{ SUBSCRIPTIONS : defines
  ACCOUNTS {
    uuid account_id PK
    string account_type
    string account_name
    string status
  }
  MEMBERS {
    uuid member_id PK
    uuid account_id FK
    string email
    date join_date
  }
  SUBSCRIPTIONS {
    uuid subscription_id PK
    uuid member_id FK
    uuid plan_id FK
    date start_date
    date end_date
    string status
    decimal billed_amount
  }
  PLANS {
    uuid plan_id PK
    string plan_name
    string tier
    decimal monthly_price
  }`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
</body>
</html>
