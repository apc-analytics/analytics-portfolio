<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Segoe UI", sans-serif',
  themeVariables: dark ? {
    darkMode: true,
    fontSize: '13px',
    primaryColor: '#262B2F',
    primaryTextColor: '#EDEAE2',
    primaryBorderColor: '#3a3f44',
    lineColor: '#9c9a92',
    textColor: '#EDEAE2',
    attributeBackgroundColorOdd: '#171B1E',
    attributeBackgroundColorEven: '#1c2226',
  } : {
    darkMode: false,
    fontSize: '13px',
    primaryColor: '#F2EEE4',
    primaryTextColor: '#1a1a1a',
    primaryBorderColor: '#c9c4b5',
    lineColor: '#73726c',
    textColor: '#1a1a1a',
    attributeBackgroundColorOdd: '#ffffff',
    attributeBackgroundColorEven: '#f5f3ee',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  ACCOUNTS ||--o{ MEMBERS : has
  MEMBERS ||--o{ SUBSCRIPTIONS : enrolls_in
  PLANS ||--o{ SUBSCRIPTIONS : defines
  ACCOUNTS {
    uuid account_id PK
    string account_type
    string account_name
    string status
  }
  MEMBERS {
    uuid member_id PK
    uuid account_id FK
    string email
    date join_date
  }
  SUBSCRIPTIONS {
    uuid subscription_id PK
    uuid member_id FK
    uuid plan_id FK
    date start_date
    date end_date
    string status
    decimal billed_amount
  }
  PLANS {
    uuid plan_id PK
    string plan_name
    string tier
    decimal monthly_price
  }`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
