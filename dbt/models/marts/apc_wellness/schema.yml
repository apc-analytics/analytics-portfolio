version: 2

models:
  - name: mart_apc_wellness__revenue_trend
    description: Monthly MRR and one-time revenue trend, straight passthrough of int_apc_wellness__monthly_revenue.
    columns:
      - name: month_start
        tests:
          - unique
          - not_null

  - name: mart_apc_wellness__revenue_by_segment
    description: Active MRR broken down by account type (organization/individual) and plan tier.
    columns:
      - name: account_type
        tests:
          - not_null
      - name: plan_name
        tests:
          - not_null

  - name: mart_apc_wellness__engagement_by_segment
    description: >
      Engagement (streaks) and value (MRR + one-time orders) broken down
      by account type and plan tier, with average membership tenure
      included specifically to check whether one segment simply has more
      time to accumulate engagement/orders than another before drawing
      conclusions from the raw numbers. Promoted from an ad-hoc query
      written and peer-reviewed for the "employer-sponsored vs. self-pay"
      case study.
    columns:
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organization', 'individual']
      - name: tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['standard', 'premium']

  - name: mart_apc_wellness__revenue_by_campaign
    description: >
      Every campaign joined to its attributed active MRR (via
      account_acquisition), with spend_per_attributed_subscription (a
      rough CAC) and payback_period_months derived from it. NULL in
      either derived column means the campaign has zero attributed
      subscriptions, not zero cost — division by zero is undefined, not 0.
    columns:
      - name: campaign_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_apc_wellness__campaigns')
                field: campaign_id

  - name: mart_apc_wellness__tickets_overall
    description: >
      Whole-portfolio support ticket metrics — volume, CSAT, resolution
      time, and open/pending/closed counts and ages. as_of_date anchors
      to max(created_at) in the source table (not current_date, and not
      max(resolved_at) — the latter under-ages the backlog, since it's
      only populated for closed tickets and lags behind when the
      snapshot was actually taken).

  - name: mart_apc_wellness__tickets_by_category
    description: Support ticket metrics broken down by ticket_category, with avg_overall_csat_rating carried alongside each row for easy comparison against the whole-portfolio baseline.
    columns:
      - name: ticket_category
        tests:
          - unique
          - not_null

  - name: mart_apc_wellness__tickets_by_priority
    description: Support ticket metrics broken down by ticket_priority.
    columns:
      - name: ticket_priority
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Medium', 'Low']

  - name: mart_apc_wellness__tickets_by_channel
    description: Support ticket metrics broken down by ticket_channel.
    columns:
      - name: ticket_channel
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['Chat', 'Email', 'Social media', 'Phone']